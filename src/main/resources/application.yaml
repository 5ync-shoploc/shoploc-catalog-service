spring:
  application:
    name: shoploc-catalog-service
  config:
    # ".env[.properties]" : lit un fichier .env local (voir .env.example), pour fournir
    # DB_USERNAME/DB_PASSWORD sans avoir à les exporter ni à les saisir dans IntelliJ.
    import: optional:configserver:http://localhost:8888,optional:file:.env[.properties]
  jpa:
    properties:
      jakarta.persistence.create-database-schemas: true